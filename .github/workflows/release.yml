# Release workflow: builds and publishes Coderm installers + REH server to GitHub Releases.
# Triggers on every push to main (with duplicate-version skip) or manual dispatch.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one release run at a time; never cancel an in-progress release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Reads the version from package.json and checks whether a GitHub Release
  # for that version already exists.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      # Full history is needed so that `gh release view` can resolve the tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release for ${TAG}. Proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # Builds Coderm for macOS (ARM) and Windows (x64) in parallel.
  # fail-fast is disabled so one platform failure does not cancel the others.
  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
            arch: arm64
            artifact: Coderm-arm64.dmg
          - target: win32-x64
            os: windows-2022
            arch: x64
            artifact: CodermSetup-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 720
    env:
      # VSCODE_ARCH and VSCODE_QUALITY are consumed by the upstream gulp tasks.
      VSCODE_ARCH: ${{ matrix.arch }}
      VSCODE_QUALITY: coderm
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # macOS builds require Python for native module compilation (node-gyp).
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'

      - run: npm ci

      # Build open-remote-ssh from the Coderm fork. The fork uses
      # ManagedResolvedAuthority instead of ResolvedAuthority, eliminating
      # local TCP listeners that trigger Windows firewall dialogs on
      # unsigned binaries. Building from source avoids maintaining a
      # separate VSIX release on the fork repo.
      - name: Build open-remote-ssh extension from fork
        shell: bash
        run: |
          git clone --branch managed-resolved-authority --depth 1 https://github.com/j4rviscmd/open-remote-ssh.git /tmp/open-remote-ssh
          cd /tmp/open-remote-ssh
          npm install
          npm run build
          EXT_DIR="$GITHUB_WORKSPACE/.build/builtInExtensions/jeanp413.open-remote-ssh"
          mkdir -p "$EXT_DIR"
          cp package.json "$EXT_DIR/"
          cp -r lib "$EXT_DIR/"
          [ -d resources ] && cp -r resources "$EXT_DIR/"
          [ -f LICENSE ] && cp LICENSE "$EXT_DIR/"
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "$EXT_DIR/"
          echo "Built open-remote-ssh $(node -p "require('$EXT_DIR/package.json').version")"

      - run: npm run gulp compile-build-without-mangling

      # Invokes the upstream VSCode gulp task for the target platform,
      # producing the unpacked app in the repo's parent directory.
      - name: Build distribution
        run: npm run gulp vscode-${{ matrix.target }}

      - name: Copy Inno Updater
        if: runner.os == 'Windows'
        run: npm run gulp vscode-win32-x64-inno-updater

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run gulp vscode-win32-x64-user-setup

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: node build/darwin/create-dmg.ts "$(pwd)/.." "$(pwd)/.build"

      - name: Rename macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DMG_PATH=$(find .build -name "*.dmg" -type f | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "ERROR: No DMG file found"
            exit 1
          fi
          cp "$DMG_PATH" "${{ matrix.artifact }}"

      - name: Rename Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setupPath = Get-ChildItem -Path ".build\win32-x64\user-setup" -Filter "*.exe" | Select-Object -First 1
          if (-not $setupPath) {
            $setupPath = Get-ChildItem -Path ".build" -Recurse -Filter "*Setup*.exe" | Select-Object -First 1
          }
          if (-not $setupPath) {
            Write-Error "No Windows setup exe found"
            exit 1
          }
          Copy-Item $setupPath.FullName -Destination "${{ matrix.artifact }}"

      # Artifacts are kept for 1 day -- just long enough for the create-release job.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  # Builds the REH (Remote Extension Host) server for 4 platforms.
  # The REH server is the headless VS Code backend that runs on remote
  # machines. It is downloaded by the Coderm client via the URL template
  # configured in product.json's serverDownloadUrlTemplate field.
  build-reh:
    name: Build REH (${{ matrix.target }})
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            arch: x64
            platform: linux
          - target: linux-arm64
            os: ubuntu-latest
            arch: arm64
            platform: linux
          - target: linux-armhf
            os: ubuntu-latest
            arch: armhf
            platform: linux
          - target: darwin-arm64
            os: macos-14
            arch: arm64
            platform: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 720
    env:
      VSCODE_ARCH: ${{ matrix.arch }}
      VSCODE_QUALITY: coderm
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev

      - name: Set up QEMU
        if: matrix.platform == 'linux' && matrix.arch != 'x64'
        uses: docker/setup-qemu-action@v3

      - name: Create swap
        if: runner.os == 'Linux'
        run: |
          if swapon --show=NAME --noheadings | grep -q '/swapfile'; then
            sudo swapoff /swapfile
          fi
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - run: npm ci

      - name: Build open-remote-ssh extension from fork
        shell: bash
        run: |
          git clone --branch managed-resolved-authority --depth 1 https://github.com/j4rviscmd/open-remote-ssh.git /tmp/open-remote-ssh
          cd /tmp/open-remote-ssh
          npm install
          npm run build
          EXT_DIR="$GITHUB_WORKSPACE/.build/builtInExtensions/jeanp413.open-remote-ssh"
          mkdir -p "$EXT_DIR"
          cp package.json "$EXT_DIR/"
          cp -r lib "$EXT_DIR/"
          [ -d resources ] && cp -r resources "$EXT_DIR/"
          [ -f LICENSE ] && cp LICENSE "$EXT_DIR/"
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "$EXT_DIR/"
          echo "Built open-remote-ssh $(node -p "require('$EXT_DIR/package.json').version")"

      - run: npm run gulp compile-build-without-mangling

      - name: Build REH server
        env:
          MANGLER_MAX_WORKERS: 1
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run gulp vscode-reh-${{ matrix.platform }}-${{ matrix.arch }}-min

      # The gulp build produces a complete node_modules/ from remote/node_modules.
      # JS packages are platform-independent, but native addons (.node files) are
      # compiled for the runner's x64 architecture. This step rebuilds only the
      # native modules for the target ARM architecture via Docker + QEMU emulation.
      - name: Cross-compile native modules for ARM
        if: matrix.platform == 'linux' && matrix.arch != 'x64'
        shell: bash
        run: |
          NODE_MAJOR=$(node -v | sed 's/v\([0-9]*\).*/\1/')
          case "${{ matrix.arch }}" in
            arm64) DOCKER_PLATFORM="linux/arm64" ;;
            *)     DOCKER_PLATFORM="linux/arm/v7" ;;
          esac
          SRC_DIR="$(pwd)"
          REH_DIR="${SRC_DIR}/../vscode-reh-linux-${{ matrix.arch }}"
          echo "Rebuilding native modules for ${{ matrix.arch }} via Docker (${DOCKER_PLATFORM})"
          cd "${REH_DIR}"
          docker run --rm --platform "${DOCKER_PLATFORM}" \
            -v "$(pwd)/..":/build \
            -w "/build/vscode-reh-linux-${{ matrix.arch }}" \
            "node:${NODE_MAJOR}" \
            sh -c "npm rebuild && find node_modules -name '*.node' -exec file {} \;"

      - name: Package REH tarball
        shell: bash
        run: |
          cd ..
          tar czf "${{ github.workspace }}/coderm-reh-${{ matrix.target }}.tar.gz" \
            "vscode-reh-${{ matrix.platform }}-${{ matrix.arch }}"

      - name: Upload REH artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderm-reh-${{ matrix.target }}
          path: coderm-reh-${{ matrix.target }}.tar.gz
          retention-days: 1

  create-release:
    name: Create Release
    needs: [preflight, build, build-reh]
    if: >-
      always() &&
      needs.preflight.outputs.skip != 'true' &&
      needs.build.result == 'success' &&
      needs.build-reh.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "Coderm*"
          path: artifacts
          merge-multiple: true

      - name: Download REH build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "coderm-reh-*"
          path: artifacts
          merge-multiple: true

      - name: Verify all assets
        run: |
          echo "Verifying assets..."
          MISSING=""
          for f in Coderm-arm64.dmg CodermSetup-x64.exe \
                   coderm-reh-linux-x64.tar.gz coderm-reh-linux-arm64.tar.gz \
                   coderm-reh-linux-armhf.tar.gz coderm-reh-darwin-arm64.tar.gz; do
            if [ ! -f "artifacts/$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: Missing assets:$MISSING"
            ls -la artifacts/
            exit 1
          fi
          echo "All assets present."
          ls -la artifacts/

      - name: Create release with assets
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          echo "Creating release ${TAG}"
          gh release create "${TAG}" \
            --title "Coderm ${TAG}" \
            --generate-notes \
            artifacts/Coderm-arm64.dmg \
            artifacts/CodermSetup-x64.exe \
            artifacts/coderm-reh-linux-x64.tar.gz \
            artifacts/coderm-reh-linux-arm64.tar.gz \
            artifacts/coderm-reh-linux-armhf.tar.gz \
            artifacts/coderm-reh-darwin-arm64.tar.gz

  # If any downstream job (build, build-reh, or create-release) fails, remove
  # the draft release and its tag to keep the Releases page clean. Only runs
  # when the preflight did not skip (i.e. this run actually attempted a release).
  cleanup-on-failure:
    name: Cleanup on failure
    needs: [preflight, build, build-reh, create-release]
    if: failure() && needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Delete draft release and tag
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Deleting draft release ${TAG}"
            gh release delete "${TAG}" --yes --cleanup-tag
          fi
